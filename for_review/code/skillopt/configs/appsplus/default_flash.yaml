_base_: ../_base_/default.yaml

# ── Backend: deepseek-v4-flash via qwen_chat (SkillOpt on APPS_Plus) ────────────
# 目的: 验证 flash + gated slow_update 能否在 APPS_Plus (大数据集 val/test 远超
#   ClassEval val=10 饱和点) 上让 skill-text 优化 Δ 跳出噪声.
#
# vs V3.2 判死 run (appsplus_full_optimize, 2026-07) 三处关键差异:
#   1. model: V3.2(DeepSeek-V3.2) → flash(deepseek-v4-flash)        # B1 已证强模型翻转 LCB 负结论
#   2. cap:   4096 → 16384                                          # 同 B1 flash 口径, 竞赛代码可较长
#   3. slow_update_gate_with_selection: false → true                # ⭐ THE FIX
#      V3.2 用 force-accept 把 slow guidance 无条件堆进 skill → 膨胀到 11639 chars
#      → ClassEval 上 final −4.3pp. gated 让 slow candidate 也过 val gate, 防膨胀退化.
#
# ── 采样 (避免 V3.2 30h + 小样本假阳性双重陷阱) ────────────────────────────────
# APPS_Plus interview=3950, ratio 2:1:7 seed42 → train=790/val=395/test=2765.
# V3.2 train=790 → 80 steps × 395-item selection eval/step = 30h 不可行.
# 本 run 三重 cap (ratio split seed42 确定性, cap 取前 N, 可复现可扩展):
#   • train_size=80   → ceil(80/40)=2 steps/epoch × 4ep = 8 steps (对齐 B1 收敛步数)
#   • sel_env_num=100 → 10× ClassEval val=10, 跳出 0.9 饱和; paired-gate 区分 skill 变体
#   • test_env_num=300 → paired McNemar 检 ±3pp; ratio+seed42 确定性 → 前 300 是 2765 的稳定子集
# 大数据集的意义在 eval 信号分辨率 (val/test 大), 非训练算力; train 8 步够优化 (B1 证).
# 后续若信号有趣: test_env_num=0 即全量 2765 复测确认 (同 split 前 300 子集, 可对位).
model:
  backend: qwen_chat
  optimizer: deepseek-v4-flash
  target: deepseek-v4-flash
  optimizer_backend: qwen_chat
  target_backend: qwen_chat
  reasoning_effort: ""
  qwen_chat_temperature: "0.0"
  qwen_chat_max_tokens: "16384"
  qwen_chat_enable_thinking: "false"
  qwen_chat_timeout_seconds: 600

train:
  train_size: 80          # cap → 8 steps (B1 口径); 全量 train=790 会 80 步 30h
  batch_size: 40
  accumulation: 1
  num_epochs: 4           # 对齐 B1/V3.2 口径
  seed: 42

gradient:
  minibatch_size: 8
  merge_batch_size: 8
  analyst_workers: 16
  max_analyst_rounds: 3
  failure_only: false

optimizer:
  learning_rate: 4            # edit_budget, 对齐 V3.2/B1
  skill_update_mode: patch    # 对齐 V3.2/B1
  use_slow_update: true
  slow_update_samples: 20     # 对齐 V3.2/B1
  # ⭐ THE FIX: gated (非 force-accept). V3.2 force-accept → skill 膨胀 11639 chars → 退化.
  # gated 让 slow candidate 也过 val gate, 只有真超 current 才注入.
  slow_update_gate_with_selection: true

evaluation:
  use_gate: true
  gate_metric: hard           # 对齐 V3.2; val=100 → hard 粒度 0.01, 远优于 ClassEval val=10 的 0.1
  sel_env_num: 100            # 10× ClassEval val, 跳出饱和 (paired-gate)
  test_env_num: 300           # paired McNemar ±3pp; 确定性子集 (可扩 2765 复测)
  eval_test: true

env:
  name: appsplus
  skill_init: skillopt/envs/appsplus/skills/initial.md
  split_mode: split_dir       # ⭐ 消费预建 capped split (train80/val395/test2765)
  split_ratio: "2:1:7"
  split_seed: 42
  # split_dir: 包内随附预建 capped split。load_config 无环境插值, 故写包内绝对路径;
  # reviewer 若要换 split, 复制本 yaml 并改此行, 再用 --config 指向副本。
  # 源仓库对应路径: /data/zhuldz/skillopt/data/appsplus_capped_seed42
  split_dir: /data/zhuldz/lunwen/for_review/data/appsplus_capped_seed42
  # data_path: 原始数据集, split_mode=split_dir 时仅 fallback (split 已含完整题目);
  # 源仓库: /data/zhuldz/lunwen/data/APPS_Plus/data/v1 (体积大, 未随包)
  data_path: /data/zhuldz/lunwen/data/APPS_Plus/data/v1
  split_output_dir: ""
  max_turns: 1                # single-shot, 对齐 V3.2 (2-turn 是 ClassEval doctest 专属, 此处不开)
  max_completion_tokens: 16384   # V3.2=4096; flash 口径 16384 (同 B1)
  exec_timeout: 300
  workers: 8
  limit: 0
  dataset_glob: data_with_id.json
  difficulty_filter: interview
